# ComfyUI extra model paths (edit-image service)
# Paths are relative to services/edit-image/ComfyUI.
# Override this file locally if shared models live elsewhere.

a111:
    base_path: ../../stable-diffusion/
    checkpoints: models/Stable-diffusion
    configs: models/Stable-diffusion
    vae: models/VAE
    loras: |
         models/Lora
    upscale_models: |
                  models/ESRGAN
                  models/SwinIR
    hypernetworks: models/hypernetworks

main_comfyui:
    base_path: ../../../ComfyUI/
    checkpoints: models/checkpoints
    clip: models/clip
    clip_vision: models/clip_vision
    configs: models/configs
    controlnet: models/controlnet
    diffusion_models: |
                 models/diffusion_models
                 models/unet
    embeddings: models/embeddings
    loras: models/loras
    upscale_models: models/upscale_models
    vae: models/vae

edit_image_base:
    base_path: ../models/
    checkpoints: base/sdxl-base
