[pytest]
# Marker definitions — use -m to include/exclude categories
markers =
    slow: marks tests as slow-running (deselect with '-m "not slow"')
    integration: marks tests that require external services (DB, APIs, sidecars)
    unit: marks tests as pure unit tests
    api: marks tests as API/route tests
    smoke: marks tests as smoke tests
    image: marks tests for the image/anime pipeline (require image_pipeline, may need GPU)
    rag: marks tests that require RAG dependencies (pgvector, redis, etc.)
    hermes: marks tests for Hermes sidecar integration (require HERMES_ENABLED sidecar)
    mongo: marks tests that require a live MongoDB connection
    agentic: marks tests for the multi-thinking agentic pipeline (require pytest-asyncio)

# NOTE: --strict-markers intentionally omitted until all test files carry markers.
# Add it in P1 once marker coverage is complete.

# Async test mode — requires pytest-asyncio in venv-core
asyncio_mode = auto

# Reasonable defaults for local dev
addopts = -v --tb=short

# Test discovery from services/chatbot/
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
