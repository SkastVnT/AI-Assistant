<!-- ═══ Custom titlebar (Electron only — hidden in browser via CSS) ═══ -->
<div class="app-titlebar" id="appTitlebar" role="toolbar" aria-label="Window title bar">
    <span class="app-titlebar__brand">
        <i data-lucide="bot" class="lucide"></i>
        <span>AI-Assistant</span>
    </span>
    <span class="app-titlebar__spacer"></span>
    <div class="app-titlebar__controls">
        <button type="button" class="app-titlebar__btn" id="titlebarMinBtn" title="Minimize" aria-label="Minimize">
            <i data-lucide="minus" class="lucide"></i>
        </button>
        <button type="button" class="app-titlebar__btn" id="titlebarMaxBtn" title="Maximize" aria-label="Maximize">
            <i data-lucide="square" class="lucide"></i>
        </button>
        <button type="button" class="app-titlebar__btn app-titlebar__btn--close" id="titlebarCloseBtn" title="Close" aria-label="Close">
            <i data-lucide="x" class="lucide"></i>
        </button>
    </div>
</div>

<!-- JS error overlay — hidden by default; press Ctrl+Shift+D to toggle. -->
<div id="__jsDebugOverlay" hidden style="position:fixed;bottom:12px;right:12px;z-index:99999;max-width:480px;background:#1e1e2e;color:#f38ba8;border:1px solid #f38ba8;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:12px;line-height:1.5;max-height:220px;overflow:auto;box-shadow:0 4px 24px rgba(0,0,0,.6)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <strong>JS errors</strong>
    <button id="__jsDebugClose" type="button" aria-label="Close" style="background:none;border:none;color:#f38ba8;cursor:pointer;font-size:16px;line-height:1;">×</button>
  </div>
  <div id="__jsDebugMsg" style="white-space:pre-wrap;word-break:break-word;"></div>
</div>
