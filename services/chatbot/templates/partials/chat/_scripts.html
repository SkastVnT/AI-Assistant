<!-- Lucide Icons: loaded here (after all modules) so it never blocks initial paint -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" onload="(function(){if(window.lucide)lucide.createIcons();console.log('[Lucide] Icons initialized');})()"></script>
<!-- Initialize Lucide Icons -->
<script>
    // Helper: swap a lucide icon inside an element
    window.swapLucideIcon = function(element, iconName) {
        if (!element) return;
        element.innerHTML = '<i data-lucide="' + iconName + '" class="lucide"></i>';
        if (window.lucide) lucide.createIcons({nodes: [element]});
    };
</script>
