<!-- Right Status Sidebar (collapsible) -->
<aside class="right-sidebar collapsed" id="rightSidebar" aria-label="Status panel">
    <div class="right-sidebar__header">
        <h3 class="right-sidebar__title">Status</h3>
        <button class="right-sidebar__close" id="rightSidebarCloseBtn" aria-label="Close panel">×</button>
    </div>
    <div class="right-sidebar__body">
        <section class="right-sidebar__section" id="rightSidebarCharacterSection">
            <div class="right-sidebar__section-title">Active character</div>
            <div id="rightSidebarCharacterBody" class="right-sidebar__character right-sidebar__placeholder">
                Chưa chọn nhân vật. Mở <em>Tools → Chọn nhân vật</em> để chọn.
            </div>
        </section>
        <section class="right-sidebar__section">
            <div class="right-sidebar__section-title">Active skill</div>
            <div id="rightSidebarSkillBody" class="right-sidebar__placeholder">
                Không có skill nào đang bật.
            </div>
        </section>
        <section class="right-sidebar__section">
            <div class="right-sidebar__section-title">Job queue</div>
            <div id="rightSidebarJobsSummary" class="right-sidebar__jobs">
                <div class="right-sidebar__placeholder">Đang chờ dữ liệu…</div>
            </div>
            <button type="button" class="right-sidebar__action" id="rightSidebarOpenJobs">
                <i data-lucide="external-link" class="lucide"></i> Mở chi tiết hàng đợi
            </button>
        </section>
    </div>
</aside>

<!-- Thinking Side Panel -->
<div class="thinking-side-panel" id="thinkingSidePanel" aria-hidden="true">
    <div class="thinking-side-panel__header">
        <div class="thinking-side-panel__title-wrap">
            <span class="thinking-side-panel__brain">🧠</span>
            <span class="thinking-side-panel__title" id="thinkingPanelTitle">Thinking...</span>
        </div>
        <button class="thinking-side-panel__close" id="thinkingPanelClose" title="Close panel" tabindex="-1" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="thinking-side-panel__body" id="thinkingPanelBody"></div>
</div>

<!-- Hidden elements for backward compat -->
<div class="hidden">
    <button id="clearBtn"></button>
</div>
