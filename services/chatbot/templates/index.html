<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>AI Assistant</title>

    <!-- New modular UI shell. Order matters: tokens → layout → components → debug. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/composer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tools.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modals.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/debug.css') }}">
</head>
<body data-theme="dark" data-state="idle">
    <div class="app-shell">
        <aside id="sidebar" class="sidebar" aria-label="Conversations">
            <div class="sidebar__header">
                <button id="newChatBtn" class="sidebar__btn sidebar__btn--primary" type="button">+ New chat</button>
                <button id="refreshConvsBtn" class="sidebar__btn sidebar__btn--icon" type="button" title="Refresh list" aria-label="Refresh conversation list">⟳</button>
            </div>
            <ul id="conversationList" class="sidebar__list" role="list"></ul>
            <div id="sidebarStatus" class="sidebar__status" aria-live="polite"></div>
        </aside>

        <header id="topbar" class="topbar">
            <button id="sidebarToggleBtn" class="topbar__btn topbar__btn--icon" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
            <div id="conversationTitle" class="topbar__title" title="Current conversation"></div>
            <div class="topbar__spacer"></div>
            <button id="rightPanelToggleBtn" class="topbar__btn topbar__btn--icon" type="button" title="Toggle gallery" aria-label="Toggle gallery">⊞</button>
            <button id="themeToggleBtn" class="topbar__btn topbar__btn--icon" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
            <button id="debugToggleBtn" class="topbar__btn topbar__btn--icon" type="button" title="Toggle debug panel (Ctrl+Shift+D)" aria-label="Toggle debug panel">⚙</button>
        </header>

        <main id="chatContainer" class="chat" aria-live="polite">
            <div id="messageList" class="chat__list" role="log"></div>
            <div id="streamStatus" class="chat__status" hidden>
                <span class="chat__status-dot" aria-hidden="true"></span>
                <span id="streamStatusText">Generating…</span>
            </div>
        </main>

        <footer id="composer" class="composer" aria-label="Message composer">
            <div id="composerChips" class="composer__chips" role="list"></div>
            <div class="composer__row">
                <button id="attachFilesBtn" class="composer__btn composer__btn--icon" type="button" title="Attach files" aria-label="Attach files">📎</button>
                <input id="fileInput" type="file" multiple hidden>
                <textarea
                    id="composerInput"
                    class="composer__input"
                    placeholder="Type a message. Enter to send, Shift+Enter for newline."
                    rows="1"
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>
                <button id="stopBtn" class="composer__btn composer__btn--stop" type="button" title="Stop generation" aria-label="Stop" hidden>■</button>
                <button id="sendBtn" class="composer__btn composer__btn--send" type="button" title="Send (Enter)" aria-label="Send">➤</button>
            </div>
            <div class="composer__tools" id="toolsBar"></div>
        </footer>

        <aside id="rightPanel" class="right-panel" hidden aria-label="Conversation gallery">
            <div class="right-panel__header">
                <h2 class="right-panel__title">Gallery</h2>
                <span id="galleryCount" class="right-panel__count">0</span>
            </div>
            <div id="galleryGrid" class="right-panel__grid"></div>
        </aside>
    </div>

    <div id="modalRoot" class="modal-root"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
    <aside id="debugPanel" class="debug-panel" hidden aria-label="Debug panel"></aside>

    <script type="module" src="{{ url_for('static', filename='js/app/index.js') }}"></script>
</body>
</html>
