[pytest]
# Run only the canonical chatbot test suite when invoking `pytest .` from root.
# Image-pipeline, ComfyUI, SD, and archived-service tests are collected by their
# own pytest.ini files and must be run from their respective directories.
#
# NOTE: testpaths is only used when no path is given on the CLI.
# norecursedirs is always respected, so it does the heavy lifting for `pytest .`.
testpaths = services/chatbot/tests

norecursedirs =
    .git
    venv-core
    venv-image
    node_modules
    ComfyUI
    private
    local_data
    logs
    LORA
    electron
    character_select_stand_alone_app-main
    stable-diffusion
    stable-diffusion_upstream
    edit-image

# Marker definitions (mirrors services/chatbot/pytest.ini)
markers =
    slow: marks tests as slow-running (deselect with '-m "not slow"')
    integration: marks tests that require external services (DB, APIs, sidecars)
    unit: marks tests as pure unit tests
    api: marks tests as API/route tests
    smoke: marks tests as smoke tests
    image: marks tests for the image/anime pipeline
    rag: marks tests that require RAG dependencies
    hermes: marks tests for Hermes sidecar integration
    mongo: marks tests that require a live MongoDB connection
    agentic: marks tests for the multi-thinking agentic pipeline

asyncio_mode = auto
addopts = -v --tb=short
