  - {<<: *sfw, id: MT-002, category: multi_turn_edit, instruction: "Apply the final edit.", setup: {mode: multi_turn_edit, source_image: fixtures/edit/source_02.png}, turns: [{instruction: "Change the coat to navy."}, {instruction: "Now add a silver scarf."}]}
  - {<<: *sfw, id: MT-003, category: multi_turn_edit, instruction: "Apply the final edit.", setup: {mode: multi_turn_edit, source_image: fixtures/edit/source_03.png}, turns: [{instruction: "Add a table lamp."}, {instruction: "Now make the lamp cast warm light."}]}
  - {<<: *sfw, id: MT-004, category: multi_turn_edit, instruction: "Apply the final edit.", setup: {mode: multi_turn_edit, source_image: fixtures/edit/source_04.png}, turns: [{instruction: "Remove the sign."}, {instruction: "Now add subtle rain reflections."}]}
