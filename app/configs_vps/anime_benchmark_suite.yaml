  - {<<: *sfw, id: ID-002, category: identity, instruction: "Preserve face, hair color, and eye color from the adult reference.", setup: {mode: identity, references: [{role: full, image: fixtures/identity/adult_ref_02.png}]}}
  - {<<: *sfw, id: ID-003, category: identity, instruction: "Render the adult reference character outdoors while preserving identity.", setup: {mode: identity, references: [{role: full, image: fixtures/identity/adult_ref_03.png}]}}
  - {<<: *sfw, id: ID-004, category: identity, instruction: "Render the adult reference character seated while preserving outfit anchors.", setup: {mode: identity, references: [{role: full, image: fixtures/identity/adult_ref_04.png}]}}
  - {<<: *sfw, id: ID-005, category: identity, instruction: "Preserve adult character identity under side lighting.", setup: {mode: identity, references: [{role: face, image: fixtures/identity/adult_ref_05.png}]}}
  - {<<: *sfw, id: ID-006, category: identity, instruction: "Preserve adult character identity with a different camera angle.", setup: {mode: identity, references: [{role: face, image: fixtures/identity/adult_ref_06.png}]}}
