  - {<<: *sfw, id: T2I-004, category: t2i_anime, instruction: "Anime adult astronaut standing in a colorful orbital greenhouse."}
  - {<<: *sfw, id: T2I-005, category: t2i_anime, instruction: "Anime adult musician performing on a small neon-lit stage."}
  - {<<: *sfw, id: T2I-006, category: t2i_anime, instruction: "Anime adult detective in a library with dramatic rim light."}
