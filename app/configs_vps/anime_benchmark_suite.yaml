  - {<<: *sfw, id: EDIT-002, category: semantic_edit, instruction: "Replace the coat color with navy blue while preserving face and pose.", setup: {mode: semantic_edit, source_image: fixtures/edit/source_02.png}}
  - {<<: *sfw, id: EDIT-003, category: semantic_edit, instruction: "Add a small table lamp and keep the adult character unchanged.", setup: {mode: semantic_edit, source_image: fixtures/edit/source_03.png}}
