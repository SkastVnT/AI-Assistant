version: anime-local-v1
content_mode: sfw
comparator_capture:
  mode: manual_offline_import
  systems:
    - ChatGPT Images 2.0 with thinking
    - Nano Banana 2 (Gemini 3.1 Flash Image)
    - Nano Banana Pro
blind_review:
  randomize_labels: true
  combine_human_and_local_vlm: true
defaults: &sfw
  difficulty: medium
  dimensions: [instruction_adherence, identity_consistency, anatomy, detail_handling]
  setup: {mode: t2i, language: en}
test_cases:
  - {<<: *sfw, id: T2I-001, category: t2i_anime, instruction: "Anime portrait of an adult woman in a red coat under soft studio light."}
  - {<<: *sfw, id: T2I-002, category: t2i_anime, instruction: "Anime full-body adult swordswoman on a quiet stone bridge at sunrise."}
