  - {<<: *sfw, id: MR-002, category: multi_ref, instruction: "Use the adult identity reference and pose reference in one coherent render.", setup: {mode: multi_ref, references: [{role: face, image: fixtures/multi_ref/face_02.png}, {role: pose, image: fixtures/multi_ref/pose_02.png}]}}
  - {<<: *sfw, id: MR-003, category: multi_ref, instruction: "Preserve adult identity while applying the reference palette and composition.", setup: {mode: multi_ref, references: [{role: face, image: fixtures/multi_ref/face_03.png}, {role: style, image: fixtures/multi_ref/style_03.png}]}}
  - {<<: *sfw, id: MR-004, category: multi_ref, instruction: "Combine adult identity, outfit, and background references.", setup: {mode: multi_ref, references: [{role: face, image: fixtures/multi_ref/face_04.png}, {role: full, image: fixtures/multi_ref/outfit_04.png}, {role: style, image: fixtures/multi_ref/background_04.png}]}}
