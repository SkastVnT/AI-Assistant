  - {<<: *sfw, id: AN-002, category: anatomy, instruction: "Anime adult archer drawing a bow with clear hand placement."}
  - {<<: *sfw, id: AN-003, category: anatomy, instruction: "Anime adult tailor sewing fabric with fingers visible."}
