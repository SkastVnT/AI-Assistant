deployment:
  profile: laptop_6gb
  max_concurrent: 1
  allowed_internal_origins:
    - http://127.0.0.1:8188
    - http://127.0.0.1:8080
  adult_content_policy: worker_default
capabilities:
  flux2_klein: false
  qwen_image_edit: false
  controlnet: false
  ipadapter: false
  yolo_detailer: false
  pre_upscale_v2: false
models:
  composition:
    checkpoint: waiIllustriousSDXL_v160.safetensors
    model_type: sdxl
    steps: 22
    cfg: 5.0
  beauty:
    checkpoint: waiIllustriousSDXL_v160.safetensors
    model_type: sdxl
    steps: 18
    cfg: 5.0
    denoise_strength: 0.18
  final:
    checkpoint: waiIllustriousSDXL_v160.safetensors
    model_type: sdxl
    steps: 18
    cfg: 5.0
    denoise_strength: 0.15
  loras:
    defaults:
      - name: Anime_artistic_2.safetensors
        strength: 0.65
        enabled: true
      - name: HueSpark1llust.safetensors
        strength: 0.35
        enabled: true
resolutions:
  portrait: [640, 896]
  landscape: [896, 640]
  square: [768, 768]
structure_lock:
  max_simultaneous_layers: 0
  layers:
    - type: lineart_anime
      preprocessor: AnimeLineArtPreprocessor
      controlnet_model: xinsir-controlnet-union-sdxl-1.0.safetensors
      union_control_type: canny/lineart/anime_lineart/mlsd
      strength: 0.65
      priority: 1
      optional: true
      enabled: false
    - type: depth
      preprocessor: DepthAnythingV2Preprocessor
      controlnet_model: xinsir-controlnet-union-sdxl-1.0.safetensors
      union_control_type: depth
      strength: 0.45
      priority: 2
      optional: true
      enabled: false
    - type: canny
      preprocessor: CannyEdgePreprocessor
      controlnet_model: xinsir-controlnet-union-sdxl-1.0.safetensors
      union_control_type: canny/lineart/anime_lineart/mlsd
      strength: 0.35
      priority: 3
      optional: true
      enabled: false
detection_inpaint:
  enabled: false
pipeline:
  v2_upscale_first: false
  unload_between_passes: true
vision:
  # External models are reachable only when a request explicitly selects
  # validator_mode=external_sfw_opt_in. Vision analysis itself remains local.
  model_priority: [local-vlm, gemini-2.0-flash, gpt-4o-mini]
  max_tokens: 500
local_vlm:
  url: http://127.0.0.1:8080/v1
  model: Qwen2.5-VL-3B-Instruct-GGUF
  required: false
council:
  enabled: false
  max_rounds: 0
