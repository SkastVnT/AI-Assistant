name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  security-scan:
    name: Run Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install security tools
      run: |
        pip install --upgrade pip
        pip install bandit pip-audit
        
    - name: Run Bandit (Python Security Linter)
      run: |
        bandit -r . \
          --exclude ./venv*,./.venv*,./ComfyUI,./app/ComfyUI,./private,**/tests/**,**/node_modules/** \
          --severity-level medium \
          --confidence-level medium \
          -f json -o bandit-report.json || true
        bandit -r . \
          --exclude ./venv*,./.venv*,./ComfyUI,./app/ComfyUI,./private \
          -f txt || true
      continue-on-error: true
        
    - name: Run pip-audit (PyPI Package Auditor)
      run: |
        for req in \
          services/chatbot/requirements.txt \
          services/text2sql/requirements.txt \
          services/document-intelligence/requirements.txt \
          services/speech2text/requirements.txt \
          services/image-upscale/requirements.txt \
          services/lora-training/requirements.txt \
          services/mcp-server/requirements.txt; do
          if [ -f "$req" ]; then
            echo "=== Auditing $req ==="
            pip-audit -r "$req" --desc || true
          fi
        done
      continue-on-error: true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ github.sha }}
        path: |
          bandit-report.json
        retention-days: 90
        
