name: RAG Evaluation

on:
  pull_request:
    branches: [ master, 'feat/adv_RAG' ]
    paths:
      - 'app/rag/**'

jobs:
  eval:
    name: RAG Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/rag
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: app/rag/requirements*.txt
    - run: pip install -r requirements.txt
    - name: Run evaluation
      run: |
        python -m eval.run_eval \
          --dataset eval/datasets/sample.json \
          --output eval/reports \
          --judge heuristic \
          --min-context-relevance 0.3 \
          --min-groundedness 0.3 \
          --min-answer-relevance 0.3
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rag-eval-reports
        path: app/rag/eval/reports/
        retention-days: 30
