name: CodeQL Analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7
    - name: Remove excluded directories
      run: rm -rf ComfyUI private venv* .venv*
    - uses: github/codeql-action/init@v4
      with:
        languages: python
        queries: +security-and-quality
        config: |
          paths:
            - services/
            - app/src/
            - app/image_pipeline/
          paths-ignore:
            - '**/tests/**'
            - '**/test_*'
            - '**/__pycache__/**'
            - '**/venv*/**'
    - uses: github/codeql-action/autobuild@v4
    - uses: github/codeql-action/analyze@v4
      with:
        category: "/language:python"
