name: Tests

on:
  push:
    branches: [ master, develop, 'feat/**' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test-services:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [chatbot, text2sql, image-upscale]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./services/${{ matrix.service }}
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-mock

    - name: Run service tests
      working-directory: ./services/${{ matrix.service }}
      run: |
        if [ -d tests ]; then
          pytest tests/ -v --tb=short
        else
          echo "No tests directory found for services/${{ matrix.service }}, skipping."
        fi

  test-root:
    name: Root Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-mock

    - name: Run root tests
      run: |
        pytest tests/ -v --tb=short
