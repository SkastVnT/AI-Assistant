name: Tests

on:
  push:
    branches: [ master, develop, 'feat/**', 'refactor/**' ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-chatbot:
    name: Service Tests (chatbot)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./services/chatbot
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        pip install -r ../../app/requirements/profile_core_services.txt

    - name: P0 gate (trust boundary)
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: |
        pytest tests/test_p0_trust_boundary.py tests/test_mcp_guard.py -q --no-header --tb=line

    - name: Run service tests (default gate)
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: |
        pytest tests/ \
          -m "not integration and not image and not rag and not hermes and not mongo and not slow and not agentic" \
          -q --no-header --tb=short --timeout=60
