name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, 'feat/**', 'refactor/**' ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install flake8
    - name: Syntax check
      run: |
        python -m compileall -q \
          -x '(^|[\\/])(venv|\.venv|__pycache__|site-packages|ComfyUI|private|node_modules)([\\/]|$)' \
          services app/src app/image_pipeline app/rag app/scripts
    - name: Topology guard
      run: |
        test -z "$(git ls-files 'app/ComfyUI/**')"
        grep -q 'IMAGE_PIPELINE_V2: "false"' docker-compose.yml
        grep -q 'AUTO_START_IMAGE_SERVICES: "0"' docker-compose.yml
        grep -q 'AUTO_START_COMFYUI: "0"' docker-compose.yml
        grep -q 'AUTO_START_STABLE_DIFFUSION: "0"' docker-compose.yml
    - name: Flake8 critical errors
      run: |
        flake8 services/ app/src/ app/image_pipeline/ app/rag/ app/scripts/ \
          --jobs=1 --count --select=E9,F63,F7 --show-source --statistics \
          --exclude=__pycache__,*.pyc,.git

  test-chatbot:
    name: Chatbot Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      working-directory: ./services/chatbot
      run: |
        pip install -r tests/requirements-test.txt
        pip install -r ../../app/requirements/profile_core_services.txt
    - name: P0 trust boundary + MCP guard
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: pytest tests/test_p0_trust_boundary.py tests/test_mcp_guard.py -q --no-header --tb=line
    - name: Anime policy smoke
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: pytest tests/test_anime_pipeline_local_policy.py -q --no-header --tb=line
    - name: General tests
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: |
        pytest tests/ \
          -m "not integration and not image and not rag and not hermes and not mongo and not slow and not agentic" \
          -q --no-header --tb=short --timeout=60

  electron-test:
    name: Electron Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/electron/package.json
    - working-directory: ./app/electron
      run: npm ci --ignore-scripts
    - name: Payload filter
      working-directory: ./app/electron
      run: node tests/payload-filter.test.js
    - name: Preload contract
      working-directory: ./app/electron
      run: node tests/preload-contract.test.js

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install bandit pip-audit
    - name: Bandit (Python)
      run: |
        bandit -r services/ app/src/ \
          --configfile .bandit \
          --exclude '**/tests/**,**/__pycache__/**' \
          --severity-level high --confidence-level medium \
          -f json -o bandit-report.json || true
        bandit -r services/ app/src/ \
          --configfile .bandit \
          --exclude '**/tests/**,**/__pycache__/**' \
          --severity-level high -f txt
    - name: pip-audit
      continue-on-error: true
      run: pip-audit -r app/requirements/profile_core_services.txt --desc
    - name: Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: 'services/'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'
    - uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports-${{ github.sha }}
        path: bandit-report.json
        retention-days: 30

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-chatbot, electron-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build chatbot
      if: hashFiles('services/chatbot/Dockerfile') != ''
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./services/chatbot/Dockerfile
        push: false
        tags: ai-assistant-chatbot:${{ github.sha }}
