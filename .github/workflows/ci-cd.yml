name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, 'feat/**', 'refactor/**' ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Python syntax check
      run: |
        python -m compileall -q \
          -x '(^|[\\/])(venv|\.venv|__pycache__|site-packages|ComfyUI|private|node_modules)([\\/]|$)' \
          services app/src

    - name: Run Flake8 (critical errors only)
      run: |
        flake8 services/ app/src/ \
          --count --select=E9,F63,F7 --show-source --statistics \
          --exclude=__pycache__,*.pyc,.git

  test-chatbot:
    name: Test Chatbot Service
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./services/chatbot
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        pip install -r ../../app/requirements/profile_core_services.txt

    - name: P0 gate (trust boundary)
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: |
        pytest tests/test_p0_trust_boundary.py tests/test_mcp_guard.py -q --no-header --tb=line

    - name: Run chatbot service tests (default gate)
      working-directory: ./services/chatbot
      env:
        TESTING: "True"
        MONGODB_ENABLED: "False"
      run: |
        pytest tests/ \
          -m "not integration and not image and not rag and not hermes and not mongo and not slow and not agentic" \
          -q --no-header --tb=short --timeout=60

  electron-test:
    name: Electron Payload Filter Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/electron/package.json

    - name: Install Electron dependencies
      working-directory: ./app/electron
      run: npm ci --ignore-scripts

    - name: Run payload filter tests
      working-directory: ./app/electron
      run: node tests/payload-filter.test.js

    - name: Run preload contract tests
      working-directory: ./app/electron
      run: node tests/preload-contract.test.js

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: 'fs'
        scan-ref: 'services/'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-chatbot, electron-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      fail-fast: false
      matrix:
        service: [chatbot]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      if: hashFiles(format('services/{0}/Dockerfile', matrix.service)) != ''
      uses: docker/build-push-action@v5
      with:
       context: .
        file: ./services/${{ matrix.service }}/Dockerfile
        push: false
        tags: |
          ai-assistant-${{ matrix.service }}:${{ github.sha }}
