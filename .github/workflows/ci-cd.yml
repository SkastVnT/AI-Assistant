name: CI/CD Pipeline

on:
  push:
    branches: [ master, Ver_1, develop, 'feat/**' ]
  pull_request:
    branches: [ master, Ver_1, develop ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Python syntax check
      run: |
        python -m compileall -q \
          -x '(^|[\\/])(venv|\.venv|__pycache__|site-packages)([\\/]|$)' \
          services app/src

    - name: Run Flake8 (linting)
      run: |
        flake8 . --count --select=E9,F63,F7 --show-source --statistics \
          --exclude=.git,__pycache__,venv,.venv,*venv*,site-packages,ComfyUI,node_modules,private,.tmp_*

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        service: [chatbot, text2sql, image-upscale]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./services/${{ matrix.service }}
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-mock

    - name: Run tests
      working-directory: ./services/${{ matrix.service }}
      run: |
        if [ -d tests ]; then
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term
        else
          echo "No tests directory found for services/${{ matrix.service }}, skipping."
        fi

    - name: Upload coverage
      if: hashFiles(format('services/{0}/coverage.xml', matrix.service)) != ''
      uses: codecov/codecov-action@v4
      with:
        file: ./services/${{ matrix.service }}/coverage.xml
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage

  test-root:
    name: Root Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-mock

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-services, test-root]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      fail-fast: false
      matrix:
        service: [chatbot, text2sql, document-intelligence, speech2text, lora-training]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      if: hashFiles(format('services/{0}/Dockerfile', matrix.service)) != ''
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        file: ./services/${{ matrix.service }}/Dockerfile
        push: false
        tags: |
          ai-assistant-${{ matrix.service }}:${{ github.sha }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
