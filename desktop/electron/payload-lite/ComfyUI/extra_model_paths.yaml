# Extra model paths for ComfyUI
# Lets ComfyUI see LoRAs scattered across LORA/ subdirectories without copying.
# After editing, restart ComfyUI to pick up new paths.

ai_assistant_lora:
    base_path: ../
    loras: |
        LORA/
        LORA/old/
        LORA/new_1/
        LORA/new_2/checkpoint/
        LORA/new_2/style/
        LORA/new_2/eyes/
        LORA/new_2/expression/
        LORA/new_2/character/
        LORA/new_2/pixai_mirror/
        LORA/eye_taped/
        LORA/wai-illustrious-sdxl/
    checkpoints: |
        LORA/new_2/checkpoint/
        LORA/wai-illustrious-sdxl/
