# Root tool configuration.
# Replaces the former ruff.toml, pytest.ini and .bandit at the repo root.
# This file declares no [build-system] / [project]: the repo is not an
# installable package, it is a workspace of services.

# ---------------------------------------------------------------------------
[tool.ruff]
# Lint scope: services/ app/src/ app/config/ — ComfyUI, private, venv excluded.
exclude = [
    "venv-core",
    "venv-image",
    "ComfyUI",
    "services/edit-image/ComfyUI",
    "services/stable-diffusion",
    "character_select_stand_alone_app-main",
    "image_pipeline",
    "private",
    "private copy",
    "rag",
    ".git",
    "node_modules",
]

[tool.ruff.lint]
# Rules: E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TID252"]
ignore = [
    "E501",   # Line too long; handled by formatter
    "B008",   # Do not perform function calls in default args (Flask patterns)
    "B904",   # raise ... from ...; too noisy for existing code
    "UP007",  # Use X | Y for unions; requires Python 3.10+
    "SIM105", # Use contextlib.suppress; style preference
]

[tool.ruff.lint.per-file-ignores]
"services/chatbot/tests/**" = ["S101", "E402", "F821"]  # Allow assert in tests; E402 from sys.path.insert pattern; F821 from lazy imports in return annotations
"services/chatbot/routes/**" = ["E402"]  # Intentional sys.path.insert before imports
"services/chatbot/scripts/**" = ["E402"]  # Intentional sys.path.insert before imports
"app/scripts/**" = ["E402"]  # Intentional sys.path.insert before imports
"services/chatbot/src/utils/performance_integration.py" = ["F821"]  # Prototype snippet file with intentionally unbound refs
"services/chatbot/app/services/image_orchestrator/prompt_builder.py" = ["F821"]  # TYPE_CHECKING pattern; has type: ignore
"services/chatbot/app/services/image_orchestrator/provider_router.py" = ["F821"]  # TYPE_CHECKING pattern; has type: ignore
"**/migrations/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["services", "app", "core", "database"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Run only the canonical chatbot test suite when invoking `pytest` from root.
# Image-pipeline, ComfyUI, SD, and archived-service tests are collected by their
# own pytest.ini files and must be run from their respective directories.
#
# NOTE: testpaths is only used when no path is given on the CLI.
# norecursedirs is always respected, so it does the heavy lifting for `pytest .`.
testpaths = ["services/chatbot/tests"]
norecursedirs = [
    ".git",
    "venv-core",
    "venv-image",
    "node_modules",
    "ComfyUI",
    "private",
    "local_data",
    "logs",
    "LORA",
    "electron",
    "character_select_stand_alone_app-main",
    "stable-diffusion",
    "stable-diffusion_upstream",
    "edit-image",
]
markers = [
    "slow: marks tests as slow-running (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services (DB, APIs, sidecars)",
    "unit: marks tests as pure unit tests",
    "api: marks tests as API/route tests",
    "smoke: marks tests as smoke tests",
    "image: marks tests for the image/anime pipeline",
    "rag: marks tests that require RAG dependencies",
    "hermes: marks tests for Hermes sidecar integration",
    "mongo: marks tests that require a live MongoDB connection",
    "agentic: marks tests for the multi-thinking agentic pipeline",
]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
[tool.bandit]
# Vendored / third-party trees produce false positives; skip them.
exclude_dirs = [
    "ComfyUI",
    "services/stable-diffusion",
    "services/edit-image/ComfyUI",
    "private",
    "private copy",
    "venv",
    "venv-core",
    "venv-image",
    "venv-image-new",
    ".venv",
    "node_modules",
    "LORA",
    "local_data",
]
skips = ["B608"]
